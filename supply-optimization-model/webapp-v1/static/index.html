<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supply Planner</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="topbar" role="banner">
  <div class="brand" aria-label="Supply Planner">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z" fill="currentColor"/></svg>
    </span>
    <span class="brand-name">Supply Planner</span>
  </div>

  <div class="picker">
    <label for="dsPick">Planning year</label>
    <select id="dsPick" aria-describedby="dsHelp"></select>
    <span id="dsHelp" class="sr-only">The data set: the shared inputs for one planning year</span>
  </div>

  <div class="picker">
    <label for="viewPick">Looking at</label>
    <select id="viewPick"></select>
  </div>

  <div class="top-actions">
    <button id="newPlanBtn" class="btn btn-ghost-light" type="button">+ New plan</button>
    <button id="userChip" class="user-chip" type="button" aria-label="Your name">
      <span class="avatar" aria-hidden="true"></span><span class="user-name">Set your name</span>
    </button>
  </div>
</header>

<div id="banner" class="banner" role="status" aria-live="polite"></div>

<div class="shell">
  <nav class="sidenav" aria-label="Main">
    <div class="nav-group">
      <a class="nav-link" data-page="overview" href="#/overview"><span class="ico">&#9638;</span>Overview</a>
      <a class="nav-link c-upload" data-page="uploads" href="#/uploads"><span class="ico">&#8679;</span>Data uploads</a>
      <a class="nav-link c-weather" data-page="weather" href="#/weather"><span class="ico">&#10052;</span>Weather</a>
      <a class="nav-link c-compare" data-page="compare" href="#/compare"><span class="ico">&#8644;</span>Compare</a>
      <a class="nav-link" data-page="changes" href="#/changes"><span class="ico">&#8635;</span>Change log</a>
      <a class="nav-link" data-page="help" href="#/help"><span class="ico">?</span>How it works</a>
    </div>
    <div class="nav-head">
      <span>Areas</span>
      <input id="areaFilter" type="search" placeholder="Find an area" aria-label="Find an area">
    </div>
    <div id="areaNav" class="area-nav"></div>
    <div class="nav-legend" aria-label="Status colours">
      <span><i class="dot ok"></i>Planned</span>
      <span><i class="dot warn"></i>Re-run / check</span>
      <span><i class="dot bad"></i>Gaps</span>
      <span><i class="dot none"></i>Not run</span>
    </div>
  </nav>

  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="toasts" class="toasts" aria-live="assertive"></div>
<div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
  <div class="modal-card">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal-actions"></div>
  </div>
</div>

<script src="/static/ui.js"></script>
<script src="/static/app.js"></script>
<script src="/static/area.js"></script>
<script src="/static/results.js"></script>
<script src="/static/uploads.js"></script>
</body>
</html>
